# fly launch --no-deploy then `fly deploy` will use this as-is.
app = "sawit"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Must match the mount below: notes have to outlive a redeploy.
  SAWIT_DB = "/data/sawit.sqlite3"
  YTDLP_COOKIES_FILE = "/data/cookies.txt"

[mounts]
  source = "sawit_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Whisper on CPU holds the worker for a while; stopping the machine
  # mid-transcription would lose the note, so this one stays up.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response]
    pristine = true

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  # faster-whisper on CPU wants the headroom; 512MB will OOM mid-transcribe.
  size = "shared-cpu-2x"
  memory = "2gb"
