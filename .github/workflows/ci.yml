name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # yt-dlp and faster-whisper are imported lazily and are not exercised
        # by the suite, so they stay out. anthropic is installed because the
        # schema contract test checks extraction against its real surface.
        run: pip install "fastapi>=0.110" "pydantic>=2.6" "httpx>=0.27" "anthropic>=1.0,<2" "python-dotenv>=1.0" "python-multipart>=0.0.9" pytest ruff
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q
