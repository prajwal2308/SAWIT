<!DOCTYPE html>
<html>
<head>
    <title>Sawit Auth Proxy</title>
    <style>
        body { font-family: system-ui; margin: 2rem; max-width: 500px; }
        input { width: 100%; padding: 0.5rem; margin: 1rem 0; font-size: 1rem; }
        button { padding: 0.7rem 1rem; font-size: 1rem; cursor: pointer; }
        #content { margin-top: 2rem; }
    </style>
</head>
<body>
    <h1>Sawit</h1>
    <div>
        <label>API Key:</label>
        <input type="password" id="apiKey" placeholder="Paste your API key here">
        <button onclick="loadApp()">Load App</button>
    </div>
    <div id="content"></div>

    <script>
        // Load key from localStorage if available
        window.apiKey = localStorage.getItem('sawit_api_key') || '';
        if (window.apiKey) {
            document.getElementById('apiKey').value = window.apiKey;
        }

        async function loadApp() {
            window.apiKey = document.getElementById('apiKey').value;
            if (window.apiKey) {
                localStorage.setItem('sawit_api_key', window.apiKey);
                fetchPage();
            }
        }

        async function fetchPage() {
            try {
                const response = await fetch('http://127.0.0.1:8000/', {
                    headers: { 'X-API-Key': window.apiKey }
                });
                const html = await response.text();
                document.getElementById('content').innerHTML = html;
                // Re-attach event listeners if needed
                setupHandlers();
            } catch (error) {
                document.getElementById('content').innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
            }
        }

        function setupHandlers() {
            // Intercept form submissions
            const forms = document.querySelectorAll('form');
            forms.forEach(form => {
                form.onsubmit = async (e) => {
                    e.preventDefault();
                    const formData = new FormData(form);
                    const params = new URLSearchParams(formData);
                    const response = await fetch(`http://127.0.0.1:8000/?${params}`, {
                        headers: { 'X-API-Key': window.apiKey }
                    });
                    const html = await response.text();
                    document.getElementById('content').innerHTML = html;
                    setupHandlers();
                };
            });
        }

        // Auto-load if key exists
        if (window.apiKey) {
            fetchPage();
        }
    </script>
</body>
</html>
